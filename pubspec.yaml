name: budget_pro
description: Complete Budget Management App with Vault, Diary, Notebook, and Backup Features
publish_to: 'none'
version: 2.2.1+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # Storage & Database
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Date & Time
  intl: ^0.19.0
  
  # File Operations & Sharing
  file_picker: ^8.0.7
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  cunning_document_scanner: ^2.8.0
  
  # Calendar
  table_calendar: ^3.1.2
  
  # Audio & Voice
  record: ^5.1.0
  audioplayers: ^6.0.0
  permission_handler: ^12.0.2
  speech_to_text: ^7.0.0
  
  # Translation
  translator: ^1.0.0
  excel: ^4.0.6
  pdf: ^3.11.3
  
  # Desktop Support (Windows/Linux/MacOS)
  sqflite_common_ffi: ^2.3.3+1
  
  # For Web Support
  flutter_web_plugins:
    sdk: flutter
  
  # Google Sign-In & Drive API (Updated versions)
  google_sign_in: ^6.3.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.10
  http: ^1.2.0

  # Charts, Biometric, Version, Share Intent
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  package_info_plus: ^8.0.0
  receive_sharing_intent: ^1.8.0
  url_launcher: ^6.3.1
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.16.0

# Dependency overrides for desktop compatibility
dependency_overrides:
  record_linux: ^1.2.0
  record_web: ^1.1.0
  record_platform_interface: ^1.1.0
  sqflite_common_ffi: ^2.3.3+1
  speech_to_text_windows: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#4338CA"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansArabic.ttf
    - assets/icon/app_icon.png